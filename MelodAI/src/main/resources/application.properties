spring.application.name=MelodAI
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.docker.compose.enabled=false

# External API Integrations (with environment variable support)


replicate.api.token=${replicate.api.token}
cloudinary.cloud-name=${cloudinary.cloud-name}
cloudinary.api-key=${cloudinary.api-key}
cloudinary.api-secret=${cloudinary.api-secret}

google.gemini.api-key=${GCP_API_KEY}

security_key="SuperSecretMelodAIMusicGenerationAppTokenSigningKey2026!!!"
accessTokenExpirationMs=900000
refreshTokenExpirationMs=604800000